<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJobs - Vagas de Tecnologia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div>
                <h1 class="logo">Dev<span>Jobs</span></h1>
                <p class="tagline">Encontre uma oportunidade na área de tecnologia</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema">🌙</button>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <label for="busca">Buscar vagas</label>
            <input id="busca" type="search" placeholder="Ex: JavaScript, Python, remoto...">
            <p id="resultado-contagem" class="result-count"></p>
        </section>

        <section>
            <h2 class="sr-only">Lista de vagas</h2>
            <div id="jobs-grid" class="jobs-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <p>DevJobs - Atividade de Linguagem de Programação para Internet</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
